version: '3.8'

services:
  python-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
    container_name: ci_python
    restart: unless-stopped
    env_file:
      - ./python-agent/.env
    networks:
      - ci_network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  node-server:
    build:
      context: ./node-server
      dockerfile: Dockerfile
    container_name: ci_node
    restart: unless-stopped
    env_file:
      - ./node-server/.env
    environment:
      - PYTHON_AGENT_URL=http://python-agent:8000
    depends_on:
      - python-agent
    networks:
      - ci_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ci_react
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - node-server
    networks:
      - ci_network

networks:
  ci_network:
    driver: bridge